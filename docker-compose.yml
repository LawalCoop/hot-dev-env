# HOTOSM Development Environment
# Orchestrates Portal, Drone-TM, fAIr, OAM, and shared services using subdomain routing

name: hotosm-dev

networks:
  hotosm:
    name: hotosm-dev
    driver: bridge

volumes:
  portal-db-data:
  login-hanko-db-data:
  dronetm-db-data:
  chatmap-db-data:
  chatmap-sessions:
  dronetm-minio-data:
  dronetm-redis-data:
  oam-db-data:
  oam-uploader-db-data:
  oam-rustfs-data:
  fair-db-data:
  umap-db-data:
  export-tool-db-data:
  export-tool-downloads:
  raw-data-api-db-data:
  tm-db-data:

services:
  # ==========================================
  # Traefik - Reverse Proxy (Path-based Routing)
  # ==========================================
  traefik:
    image: traefik:v2.11
    container_name: hotosm-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--log.level=INFO"
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/traefik/certs:ro
      - ./traefik-tls.yml:/etc/traefik/dynamic/tls.yml:ro
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`localhost`,`127.0.0.1`) && PathPrefix(`/traefik`)"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
      # Dashboard at https://traefik.hotosm.test, as listed in the README.
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.hotosm.test`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

  # ==========================================
  # Portal - Authentication & SSO Portal
  # ==========================================

  # Portal Frontend (React + Vite)
  portal-frontend:
    platform: linux/amd64  # Required for Mac M1/M2/M3 compatibility
    build:
      context: ../portal/frontend
      dockerfile: Dockerfile
      target: development
    container_name: hotosm-portal-frontend
    volumes:
      - ../portal/frontend:/app
      - /app/node_modules
      - ../login/auth-libs/web-component:/auth-libs-src  # For local auth-libs development
      - ../ui:/hotosm-ui-src  # For local @hotosm/ui development
    environment:
      - VITE_HANKO_URL=https://login.hotosm.test
      - VITE_API_URL=https://portal.hotosm.test/api
      - VITE_DRONE_TM_FRONTEND_URL=https://dronetm.hotosm.test
      # Note: API routing handled by Traefik, not Vite proxy
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal-frontend.rule=Host(`portal.hotosm.test`)"
      - "traefik.http.routers.portal-frontend.entrypoints=websecure"
      - "traefik.http.routers.portal-frontend.tls=true"
      - "traefik.http.services.portal-frontend.loadbalancer.server.port=5173"
    depends_on:
      - portal-backend

  # Portal Backend (FastAPI)
  portal-backend:
    build:
      context: ../portal
      dockerfile: backend/Dockerfile
      target: development
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: hotosm-portal-backend
    volumes:
      - ../portal/backend:/app
      - /app/.venv
    environment:
      - DATABASE_URL=postgresql+asyncpg://portal:portal@portal-db:5432/portal
      - PORTAL_BASE_URL=https://portal.hotosm.test
      - HANKO_API_URL=http://hanko:8000
      - JWT_ISSUER=https://login.hotosm.test
      - LOGIN_GROUPS_ENABLED=true
      - LOGIN_API_URL=http://login-backend:8000
      - COOKIE_SECRET=${COOKIE_SECRET:-change-me-in-production-min-32-chars}
      - COOKIE_DOMAIN=.hotosm.test
      - COOKIE_SECURE=true
      - COOKIE_SAMESITE=none
      - OSM_CLIENT_ID=${OSM_CLIENT_ID}
      - OSM_CLIENT_SECRET=${OSM_CLIENT_SECRET}
      - FRONTEND_URL=https://portal.hotosm.test
      - BACKEND_CORS_ORIGINS=["https://portal.hotosm.test","https://login.hotosm.test","https://dronetm.hotosm.test"]
      - ADMIN_EMAILS=${ADMIN_EMAILS:-admin@hotosm.org}
      - DRONE_TM_BACKEND_URL=https://dronetm.hotosm.test/api
      - FAIR_API_BASE_URL=https://api-prod.fair.hotosm.org/api/v1
      - FAIR_VERIFY_SSL=true
      - FAIR_USER_BASE_URL=https://fair.hotosm.test
      - UMAP_BASE_URL=https://umap.hotosm.test
      - EXPORT_TOOL_API_BASE_URL=http://export-tool-app:8000/api
      - CHATMAP_BASE_URL=https://chatmap.hotosm.org
      - FIELD_TM_INTERNAL_URL=http://field-tm-backend-1:8000
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET_NAME=portal-dev
      - S3_ACCESS_KEY=dtm_user
      - S3_SECRET_KEY=somelongpassword
      - S3_PUBLIC_URL=https://s3.hotosm.test
    extra_hosts:
      - "dronetm.hotosm.test:host-gateway"
      - "fair.hotosm.test:host-gateway"
      - "export-tool.hotosm.test:host-gateway"
      - "login.hotosm.test:host-gateway"
      - "umap.hotosm.test:host-gateway"
      - "tm.hotosm.test:host-gateway"
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal-backend.rule=Host(`portal.hotosm.test`) && PathPrefix(`/api`)"
      - "traefik.http.routers.portal-backend.entrypoints=websecure"
      - "traefik.http.routers.portal-backend.tls=true"
      - "traefik.http.services.portal-backend.loadbalancer.server.port=8000"
    depends_on:
      - portal-db
      - hanko

  # Portal Database
  portal-db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64  # No ARM64 image available
    container_name: hotosm-portal-db
    environment:
      - POSTGRES_USER=portal
      - POSTGRES_PASSWORD=portal
      - POSTGRES_DB=portal
    volumes:
      - portal-db-data:/var/lib/postgresql/data
    networks:
      - hotosm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Login - Authentication & SSO Service
  # ==========================================

  # Login Frontend (React + Vite) - Custom login page
  login-frontend:
    build:
      context: ../login/frontend
      dockerfile: Dockerfile
      target: dev
    container_name: hotosm-login-frontend
    volumes:
      - ../login/frontend/src:/app/src
      - ../login/frontend/public:/app/public
      - ../login/frontend/vite.config.ts:/app/vite.config.ts
      - ../login/auth-libs/web-component:/auth-libs-src  # For local auth-libs development
    environment:
      - VITE_HANKO_URL=https://login.hotosm.test
      - VITE_BACKEND_URL=https://login.hotosm.test/api
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      # Route /app to login frontend (matches production K8s config)
      - "traefik.http.routers.login-frontend.rule=Host(`login.hotosm.test`) && PathPrefix(`/app`)"
      - "traefik.http.routers.login-frontend.entrypoints=websecure"
      - "traefik.http.routers.login-frontend.tls=true"
      - "traefik.http.routers.login-frontend.priority=1"
      - "traefik.http.services.login-frontend.loadbalancer.server.port=5174"
    depends_on:
      - login-backend

  # Login Backend (FastAPI) - Custom auth logic
  login-backend:
    build:
      context: ../login/backend
      dockerfile: Dockerfile
      target: dev
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: hotosm-login-backend
    volumes:
      - ../login/backend/app:/app/app
      - ../login/backend/.env:/app/.env
      - /app/.venv
    environment:
      - HANKO_API_URL=http://hanko:8000
      - JWT_ISSUER=https://login.hotosm.test
      - COOKIE_SECRET=${COOKIE_SECRET:-change-me-in-production-min-32-chars}
      # COOKIE_DOMAIN not set - let browser handle it (works with both localhost and 127.0.0.1)
      - OSM_CLIENT_ID=${OSM_CLIENT_ID}
      - OSM_CLIENT_SECRET=${OSM_CLIENT_SECRET}
      - OSM_REDIRECT_URI=https://login.hotosm.test/api/auth/osm/callback
      - ADMIN_EMAILS=hernangigena@gmail.com,justina@animus.com.ar,andreatchirillano@hotmail.com,emilio.mariscal@hotosm.org
      # App URLs for admin proxy
      - PORTAL_BACKEND_URL=http://portal-backend:8000
      - DRONETM_BACKEND_URL=http://dronetm-backend:8000
      - FAIR_BACKEND_URL=http://fair-backend:8000
      - LOGIN_INTERNAL_API_KEY=${LOGIN_INTERNAL_API_KEY:-hotosm-dev-internal-key}
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      # Route /me endpoint to login-backend
      - "traefik.http.routers.login-backend-me.rule=Host(`login.hotosm.test`) && Path(`/me`)"
      - "traefik.http.routers.login-backend-me.entrypoints=websecure"
      - "traefik.http.routers.login-backend-me.tls=true"
      - "traefik.http.routers.login-backend-me.priority=20"
      - "traefik.http.routers.login-backend-me.service=login-backend"
      # Route /api endpoints to login-backend
      - "traefik.http.routers.login-backend.rule=Host(`login.hotosm.test`) && PathPrefix(`/api`)"
      - "traefik.http.routers.login-backend.entrypoints=websecure"
      - "traefik.http.routers.login-backend.tls=true"
      - "traefik.http.routers.login-backend.priority=15"
      - "traefik.http.services.login-backend.loadbalancer.server.port=8000"
    depends_on:
      - hanko
      - hanko-db

  # ==========================================
  # Hanko - Core Authentication Service (from login repo)
  # ==========================================

  # Hanko database migrations (runs once before Hanko starts)
  hanko-migrate:
    platform: linux/amd64  # No ARM64 image available
    image: ghcr.io/teamhanko/hanko:latest
    container_name: hotosm-hanko-migrate
    volumes:
      - ./config/hanko-config.yaml:/etc/config/.config.yaml:ro
    command: migrate up --config /etc/config/.config.yaml
    environment:
      - DATABASE_URL=postgres://hanko:hanko@hanko-db:5432/hanko?sslmode=disable
    depends_on:
      hanko-db:
        condition: service_healthy
    networks:
      - hotosm
    restart: "no"

  hanko:
    platform: linux/amd64  # No ARM64 image available
    image: ghcr.io/teamhanko/hanko:latest
    container_name: hotosm-hanko
    volumes:
      - ./config/hanko-config.yaml:/etc/config/.config.yaml:ro
    command: serve --config /etc/config/.config.yaml public
    environment:
      - DATABASE_URL=postgres://hanko:hanko@hanko-db:5432/hanko?sslmode=disable
      - SESSION_COOKIE_DOMAIN=.hotosm.test
      - SESSION_COOKIE_HTTP_ONLY=true
      - SESSION_COOKIE_SAME_SITE=lax
      - SESSION_COOKIE_SECURE=false
      - THIRD_PARTY_COOKIE_DOMAIN=.hotosm.test
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      # Hanko API endpoints with higher priority than login-frontend
      - "traefik.http.routers.hanko-wellknown.rule=Host(`login.hotosm.test`) && PathPrefix(`/.well-known`)"
      - "traefik.http.routers.hanko-wellknown.entrypoints=websecure"
      - "traefik.http.routers.hanko-wellknown.tls=true"
      - "traefik.http.routers.hanko-wellknown.priority=50"
      - "traefik.http.routers.hanko-wellknown.service=hanko"
      - "traefik.http.routers.hanko-api.rule=Host(`login.hotosm.test`) && (PathPrefix(`/registration`) || PathPrefix(`/logout`) || PathPrefix(`/sessions`) || PathPrefix(`/users`) || PathPrefix(`/passcode`) || PathPrefix(`/webauthn`) || PathPrefix(`/token`) || PathPrefix(`/thirdparty`) || PathPrefix(`/profile`) || PathPrefix(`/emails`) || PathPrefix(`/password`) || PathPrefix(`/me`) || PathPrefix(`/flow`))"
      - "traefik.http.routers.hanko-api.entrypoints=websecure"
      - "traefik.http.routers.hanko-api.tls=true"
      - "traefik.http.routers.hanko-api.priority=10"
      - "traefik.http.routers.hanko-api.service=hanko"
      # Hanko /login endpoint for POST requests (API)
      - "traefik.http.routers.hanko-login.rule=Host(`login.hotosm.test`) && Path(`/login`) && Method(`POST`,`PUT`,`DELETE`,`PATCH`)"
      - "traefik.http.routers.hanko-login.entrypoints=websecure"
      - "traefik.http.routers.hanko-login.tls=true"
      - "traefik.http.routers.hanko-login.priority=5"
      - "traefik.http.routers.hanko-login.service=hanko"
      - "traefik.http.services.hanko.loadbalancer.server.port=8000"
    depends_on:
      hanko-db:
        condition: service_healthy
      hanko-migrate:
        condition: service_completed_successfully

  hanko-db:
    image: postgres:16-alpine
    container_name: hotosm-hanko-db
    environment:
      - POSTGRES_USER=hanko
      - POSTGRES_PASSWORD=hanko
      - POSTGRES_DB=hanko
    volumes:
      - login-hanko-db-data:/var/lib/postgresql/data
    networks:
      - hotosm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanko"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailhog - Email catcher for development (captures all emails without sending)
  mailhog:
    image: mailhog/mailhog:latest
    platform: linux/amd64  # No ARM64 image available
    container_name: hotosm-mailhog
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mail.rule=Host(`mail.hotosm.test`)"
      - "traefik.http.routers.mail.entrypoints=websecure"
      - "traefik.http.routers.mail.tls=true"
      - "traefik.http.services.mail.loadbalancer.server.port=8025"

  # ==========================================
  # Drone-TM - Drone Tasking Manager
  # ==========================================

  # Drone-TM Frontend (React + Vite)
  dronetm-frontend:
    build:
      context: ../drone-tm/src
      dockerfile: frontend/Dockerfile
      target: development
    container_name: hotosm-dronetm-frontend
    volumes:
      - ../drone-tm/src/frontend/src:/app/frontend/src
      - ../drone-tm/src/frontend/public:/app/frontend/public
      - ../drone-tm/src/frontend/vite.config.ts:/app/frontend/vite.config.ts
      - ../drone-tm/src/frontend/index.html:/app/frontend/index.html
      - ../drone-tm/src/frontend/components.json:/app/frontend/components.json
      - ../drone-tm/src/frontend/postcss.config.js:/app/frontend/postcss.config.js
      - ../drone-tm/src/frontend/tailwind.config.js:/app/frontend/tailwind.config.js
      - ../drone-tm/src/frontend/project.inlang:/app/frontend/project.inlang
      - ../drone-tm/src/frontend/messages:/app/frontend/messages
      - ../drone-tm/src/gcp-editor/dist:/app/gcp-editor/dist
      - ../login/auth-libs/web-component:/auth-libs-src  # For local auth-libs development
    environment:
      - VITE_AUTH_PROVIDER=${AUTH_PROVIDER:-hanko}
      - VITE_HANKO_URL=https://login.hotosm.test
      - VITE_FRONTEND_URL=https://dronetm.hotosm.test
      - VITE_API_URL=https://dronetm.hotosm.test/api
      # Legacy env vars (for compatibility with existing code)
      - API_URL_V1=https://dronetm.hotosm.test/api
      - BASE_URL=https://dronetm.hotosm.test/api
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dronetm-frontend.rule=Host(`dronetm.hotosm.test`)"
      - "traefik.http.routers.dronetm-frontend.entrypoints=websecure"
      - "traefik.http.routers.dronetm-frontend.tls=true"
      - "traefik.http.services.dronetm-frontend.loadbalancer.server.port=3040"
    depends_on:
      - dronetm-backend

  # Drone-TM Backend (FastAPI)
  dronetm-backend:
    build:
      context: ../drone-tm/src/backend
      dockerfile: Dockerfile
      target: service
    container_name: hotosm-dronetm-backend
    volumes:
      - ../drone-tm/src/backend/app:/project/src/backend/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://dtm:dtm@dronetm-db:5432/dtm_db
      - POSTGRES_HOST=dronetm-db
      - AUTH_PROVIDER=${AUTH_PROVIDER:-hanko}
      - HANKO_API_URL=http://hanko:8000
      - JWT_ISSUER=https://login.hotosm.test
      - COOKIE_SECRET=${COOKIE_SECRET:-change-me-in-production-min-32-chars}
      - BACKEND_URL=https://dronetm.hotosm.test
      - FRONTEND_URL=https://dronetm.hotosm.test
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=dtm_user
      - S3_SECRET_KEY=somelongpassword
      - S3_BUCKET_NAME=dtm-bucket
      - S3_DOWNLOAD_ROOT=https://s3.hotosm.test
      - REDIS_URL=redis://redis:6379
      - DRAGONFLY_DSN=redis://redis:6379/0
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - ADMIN_EMAILS=hernangigena@gmail.com,justina@animus.com.ar,andreatchirillano@hotmail.com,emilio.mariscal@hotosm.org
      - EXTRA_CORS_ORIGINS=https://dronetm.hotosm.test,https://login.hotosm.test
    command: >
      sh -c "alembic upgrade heads &&
             uvicorn app.main:api --host 0.0.0.0 --port 8000 --log-level info --reload"
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      # Main dronetm backend router (from dronetm.hotosm.test)
      - "traefik.http.routers.dronetm-backend.rule=Host(`dronetm.hotosm.test`) && PathPrefix(`/api`)"
      - "traefik.http.routers.dronetm-backend.entrypoints=websecure"
      - "traefik.http.routers.dronetm-backend.tls=true"
      # Note: Do NOT strip /api prefix - the backend expects routes under /api/*
      # Note: Portal integration routes (/api/drone-tasking-manager/*) are handled by portal-backend
      # which proxies to drone-tm with proper URL translation (e.g., /projects/user -> /projects/?filter_by_owner=true)
      # Service configuration
      - "traefik.http.services.dronetm-backend.loadbalancer.server.port=8000"
    depends_on:
      dronetm-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Drone-TM Database
  dronetm-db:
    image: postgis/postgis:16-3.4-alpine
    platform: linux/amd64  # No ARM64 image available
    container_name: hotosm-dronetm-db
    environment:
      - POSTGRES_USER=dtm
      - POSTGRES_PASSWORD=dtm
      - POSTGRES_DB=dtm_db
    volumes:
      - dronetm-db-data:/var/lib/postgresql/data
    networks:
      - hotosm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtm -d dtm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - S3-compatible storage for drone imagery
  minio:
    image: minio/minio:latest
    container_name: hotosm-minio
    command: server /data --console-address ":9090"
    environment:
      - MINIO_ROOT_USER=dtm_user
      - MINIO_ROOT_PASSWORD=somelongpassword
    volumes:
      - dronetm-minio-data:/data
    networks:
      - hotosm
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      # MinIO Console (Web UI)
      - "traefik.http.routers.minio-console.rule=Host(`minio.hotosm.test`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls=true"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9090"
      # MinIO S3 API (for presigned URLs)
      - "traefik.http.routers.minio-api.rule=Host(`s3.hotosm.test`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls=true"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.routers.minio-api.middlewares=minio-cors"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      # CORS headers for S3 API
      - "traefik.http.middlewares.minio-cors.headers.accesscontrolallowmethods=GET,OPTIONS,PUT,POST,DELETE,HEAD"
      - "traefik.http.middlewares.minio-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.minio-cors.headers.accesscontrolalloworiginlist=https://dronetm.hotosm.test,https://portal.hotosm.test,https://fair.hotosm.test"
      - "traefik.http.middlewares.minio-cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.minio-cors.headers.addvaryheader=true"

  # MinIO Init - Creates buckets on startup
  minio-init:
    image: minio/mc:latest
    container_name: hotosm-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set minio http://minio:9000 dtm_user somelongpassword;
      mc mb minio/dtm-bucket --ignore-existing;
      mc anonymous set download minio/dtm-bucket;
      mc mb minio/portal-dev --ignore-existing;
      mc anonymous set download minio/portal-dev;
      mc mb minio/fair-data --ignore-existing;
      mc anonymous set download minio/fair-data;
      echo 'Buckets created successfully';
      "
    networks:
      - hotosm

  # Redis - Cache and task queue
  redis:
    image: redis:7-alpine
    container_name: hotosm-redis
    volumes:
      - dronetm-redis-data:/data
    networks:
      - hotosm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NodeODM - Imagery processing
  nodeodm:
    image: opendronemap/nodeodm:latest
    container_name: hotosm-nodeodm
    environment:
      - NODE_OPTIONS=--max-old-space-size=8192
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nodeodm.rule=Host(`nodeodm.localhost`)"
      - "traefik.http.services.nodeodm.loadbalancer.server.port=3000"

  # ==========================================
  # OpenAerialMap - Imagery Catalog & Browser
  # ==========================================

  # OAM Frontend (React + Vite)
  oam-frontend:
    build:
      context: ../openaerialmap/frontend
      dockerfile: Dockerfile
      target: base  # OAM Dockerfile has no dev stage; run Vite directly
    container_name: hotosm-oam-frontend
    # Keep pnpm's store in the node_modules volume; by default it lands in
    # the mounted repo as frontend/.pnpm-store.
    command: sh -c "npm install -g pnpm@10.33.2 && pnpm install --store-dir /app/node_modules/.pnpm-store --config.confirm-modules-purge=false && pnpm dev --port 9000"
    volumes:
      - ../openaerialmap/frontend:/app
      - /app/node_modules
      - ../login/auth-libs/web-component:/auth-libs-src  # For local auth-libs development
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=openaerialmap.hotosm.test
      # Runtime keys are listed in openaerialmap/frontend/src/runtimeConfig.ts.
      # Unset ones (STAC, TiTiler, PMTiles) default to production.
      - VITE_HANKO_URL=https://login.hotosm.test
      - VITE_API_URL=https://openaerialmap.hotosm.test/api
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oam-frontend.rule=Host(`openaerialmap.hotosm.test`)"
      - "traefik.http.routers.oam-frontend.entrypoints=websecure"
      - "traefik.http.routers.oam-frontend.tls=true"
      - "traefik.http.routers.oam-frontend.priority=1"
      - "traefik.http.services.oam-frontend.loadbalancer.server.port=9000"
    depends_on:
      - oam-backend

  # OAM Backend (FastAPI STAC API)
  oam-backend:
    build:
      context: ../openaerialmap/backend/stac-api
      dockerfile: Dockerfile
    container_name: hotosm-oam-backend
    volumes:
      - ../openaerialmap/backend/stac-api:/app
      - /app/.venv
    environment:
      # Database configuration (stac-fastapi-pgstac format)
      - POSTGRES_USER=postgres
      - POSTGRES_PASS=postgres
      - POSTGRES_DBNAME=postgres
      - POSTGRES_HOST_READER=oam-db
      - POSTGRES_HOST_WRITER=oam-db
      - POSTGRES_PORT=5432
      # FastAPI configuration
      - ROOT_PATH=/api
      # Auth configuration
      - HANKO_API_URL=http://hanko:8000
      - JWT_ISSUER=https://login.hotosm.test
      - COOKIE_SECRET=${COOKIE_SECRET:-change-me-in-production-min-32-chars}
      - COOKIE_DOMAIN=.hotosm.test
      - COOKIE_SECURE=true
      - COOKIE_SAMESITE=none
      - OSM_CLIENT_ID=${OSM_CLIENT_ID}
      - OSM_CLIENT_SECRET=${OSM_CLIENT_SECRET}
      - AUTH_PROVIDER=${AUTH_PROVIDER:-hanko}
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oam-backend.rule=Host(`openaerialmap.hotosm.test`) && PathPrefix(`/api`)"
      - "traefik.http.routers.oam-backend.entrypoints=websecure"
      - "traefik.http.routers.oam-backend.tls=true"
      - "traefik.http.routers.oam-backend.priority=10"
      - "traefik.http.services.oam-backend.loadbalancer.server.port=8080"
    depends_on:
      oam-db:
        condition: service_healthy

  # OAM Database (PostgreSQL + pgSTAC)
  oam-db:
    platform: linux/amd64  # No ARM64 image available
    image: ghcr.io/stac-utils/pgstac:v0.9.3
    container_name: hotosm-oam-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "127.0.0.1:5437:5432"  # Host access for DB clients (5432 often taken by local Postgres)
    volumes:
      - oam-db-data:/var/lib/postgresql/data
    networks:
      - hotosm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OAM Uploader (Litestar + htmx) with HOT Login.
  # Uploads land in oam-rustfs but are not processed: the pipeline needs Argo
  # on Kubernetes, which `just test dev-cluster` in the OAM repo provides.
  oam-uploader-api:
    build:
      context: ../openaerialmap/backend/uploader-api
      dockerfile: Dockerfile
    container_name: hotosm-oam-uploader-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    volumes:
      - ../openaerialmap/backend/uploader-api/app:/app/app
      - ../openaerialmap/backend/uploader-api/migrations:/app/migrations
    environment:
      # Public URL of the uploader, used for redirects after login.
      - OAM_UPLOAD_DOMAIN=oam-upload.hotosm.test
      - OAM_FRONTEND_URL=https://openaerialmap.hotosm.test
      - OAM_API_URL=https://openaerialmap.hotosm.test/api
      - STAC_URL=https://openaerialmap.hotosm.test/api
      # "View" links open items in oam-stac-browser. The catalogue lives at /api
      # here, not at /stac as in production.
      - STAC_PUBLIC_URL=https://openaerialmap.hotosm.test/api
      - STAC_BROWSER_URL=https://oam-browser.hotosm.test
      - ARGO_ENABLED=false
      # Uploader database
      - DB_HOST=oam-uploader-db
      - DB_USER=oam
      - DB_PASSWORD=oam
      - DB_NAME=oam_uploader
      # Catalogue (shared with oam-backend)
      - PGSTAC_DB_HOST=oam-db
      - PGSTAC_DB_USER=postgres
      - PGSTAC_DB_PASSWORD=postgres
      - PGSTAC_DB_NAME=postgres
      # Object storage: the browser uploads straight to oam-s3.hotosm.test
      - S3_ENDPOINT=http://oam-rustfs:9000
      - S3_EXTERNAL_ENDPOINT=https://oam-s3.hotosm.test
      - S3_BUCKET=oam
      - S3_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=oam
      - AWS_SECRET_ACCESS_KEY=oam
      # Auth configuration
      - AUTH_PROVIDER=hotosm
      - HANKO_API_URL=http://hanko:8000
      - HANKO_PUBLIC_URL=https://login.hotosm.test
      - LOGIN_URL=https://login.hotosm.test/app
      - JWT_ISSUER=https://login.hotosm.test
      - COOKIE_SECRET=${COOKIE_SECRET:-change-me-in-production-min-32-chars}
      - COOKIE_DOMAIN=.hotosm.test
      - COOKIE_SECURE=true
      - COOKIE_SAMESITE=none
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oam-uploader.rule=Host(`oam-upload.hotosm.test`)"
      - "traefik.http.routers.oam-uploader.entrypoints=websecure"
      - "traefik.http.routers.oam-uploader.tls=true"
      - "traefik.http.services.oam-uploader.loadbalancer.server.port=8080"
    depends_on:
      oam-uploader-db:
        condition: service_healthy
      oam-uploader-migrations:
        condition: service_completed_successfully
      oam-rustfs-init:
        condition: service_completed_successfully
      oam-db:
        condition: service_healthy
      hanko:
        condition: service_started

  # STAC Browser with OAM's item links, for the uploader's "View" link. Same
  # image production serves at api.imagery.hotosm.org/browser.
  oam-stac-browser:
    build:
      context: ../openaerialmap/backend/stac-browser
    container_name: hotosm-oam-stac-browser
    environment:
      - SB_catalogUrl=https://openaerialmap.hotosm.test/api
      - SB_catalogTitle=OpenAerialMap (local)
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oam-browser.rule=Host(`oam-browser.hotosm.test`)"
      - "traefik.http.routers.oam-browser.entrypoints=websecure"
      - "traefik.http.routers.oam-browser.tls=true"
      - "traefik.http.services.oam-browser.loadbalancer.server.port=8080"

  # One-shot schema and migration runner for the uploader database.
  oam-uploader-migrations:
    build:
      context: ../openaerialmap/backend/uploader-api
      dockerfile: Dockerfile
    container_name: hotosm-oam-uploader-migrations
    entrypoint: ["/migrate-entrypoint.sh"]
    environment:
      - DB_HOST=oam-uploader-db
      - DB_USER=oam
      - DB_PASSWORD=oam
      - DB_NAME=oam_uploader
    networks:
      - hotosm
    depends_on:
      oam-uploader-db:
        condition: service_healthy
    restart: "no"

  oam-uploader-db:
    image: postgis/postgis:18-3.6-alpine
    container_name: hotosm-oam-uploader-db
    environment:
      - POSTGRES_USER=oam
      - POSTGRES_PASSWORD=oam
      - POSTGRES_DB=oam_uploader
    ports:
      - "127.0.0.1:5438:5432"  # Host access for DB clients
    volumes:
      - oam-uploader-db-data:/var/lib/postgresql
    networks:
      - hotosm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oam -d oam_uploader"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3 for OAM uploads. RustFS, as in the OAM repo: its bucket script needs
  # PutBucketCors, and the browser must read each part's ETag.
  oam-rustfs:
    image: rustfs/rustfs:1.0.0-rc.3
    container_name: hotosm-oam-rustfs
    command: server /data --console-address ":9001"
    environment:
      - RUSTFS_ACCESS_KEY=oam
      - RUSTFS_SECRET_KEY=oam
    volumes:
      - oam-rustfs-data:/data
    networks:
      - hotosm
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oam-s3.rule=Host(`oam-s3.hotosm.test`)"
      - "traefik.http.routers.oam-s3.entrypoints=websecure"
      - "traefik.http.routers.oam-s3.tls=true"
      - "traefik.http.services.oam-s3.loadbalancer.server.port=9000"

  # Creates the bucket with public reads and CORS for the uploader origin.
  # Same script the OAM chart's bucket-init job runs.
  oam-rustfs-init:
    build:
      context: ../openaerialmap/backend/uploader-api
      dockerfile: Dockerfile
    container_name: hotosm-oam-rustfs-init
    command: ["python", "/app/scripts/init_bucket.py"]
    environment:
      - S3_ENDPOINT=http://oam-rustfs:9000
      - S3_BUCKET=oam
      - S3_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=oam
      - AWS_SECRET_ACCESS_KEY=oam
      - INIT_CORS_ORIGINS=https://oam-upload.hotosm.test,https://openaerialmap.hotosm.test
    networks:
      - hotosm
    depends_on:
      oam-rustfs:
        condition: service_healthy
    restart: "no"

  # ==========================================
  # fAIr - AI Assisted Mapping
  # ==========================================

  # fAIr Frontend (React + Vite)
  fair-frontend:
    build:
      context: ../fAIr/frontend
      dockerfile: Dockerfile.dev
    container_name: hotosm-fair-frontend
    volumes:
      - ../fAIr/frontend/src:/app/src
      - ../fAIr/frontend/public:/app/public
      - ../fAIr/frontend/index.html:/app/index.html
      - ../fAIr/frontend/package.json:/app/package.json
      - ../fAIr/frontend/pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ../fAIr/frontend/tsconfig.json:/app/tsconfig.json
      - ../fAIr/frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ../fAIr/frontend/vite.config.mts:/app/vite.config.mts
      - ../login/auth-libs/web-component:/auth-libs-src  # For local auth-libs development
    environment:
      - VITE_AUTH_PROVIDER=${AUTH_PROVIDER:-hanko}
      - VITE_HANKO_URL=https://login.hotosm.test
      - VITE_BASE_API_URL=https://fair.hotosm.test/api/v1/
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fair-frontend.rule=Host(`fair.hotosm.test`)"
      - "traefik.http.routers.fair-frontend.entrypoints=websecure"
      - "traefik.http.routers.fair-frontend.tls=true"
      - "traefik.http.services.fair-frontend.loadbalancer.server.port=3500"
    depends_on:
      - fair-backend

  # fAIr Backend (Django) - v3.0 architecture: pydantic-settings config,
  # single Dockerfile (no more Dockerfile.API/Dockerfile.workers), Celery/Redis
  # dropped in favor of ZenML + MLflow + STAC + MinIO (see fAIr/backend/config/env.py)
  fair-backend:
    build:
      context: ../fAIr/backend
    container_name: hotosm-fair-backend
    volumes:
      - ../fAIr/backend:/app
      - /app/.venv  # Preserve .venv from build
    environment:
      - DEBUG=true
      - SECRET_KEY=${FAIR_SECRET_KEY:-django-insecure-dev-key-for-local-hotosm-development-only}
      - DATABASE_URL=postgis://fair:fair@fair-db:5432/fair
      - ALLOWED_HOSTS=fair.hotosm.test,localhost,fair-backend
      - CORS_ALLOWED_ORIGINS=https://fair.hotosm.test,https://login.hotosm.test
      - FRONTEND_URL=https://fair.hotosm.test
      - API_BASE_URL=https://fair.hotosm.test
      - AUTH_PROVIDER=${AUTH_PROVIDER:-hanko}
      - HANKO_API_URL=http://hanko:8000
      - COOKIE_SECRET=${COOKIE_SECRET:-change-me-in-production-min-32-chars}
      - COOKIE_DOMAIN=.hotosm.test
      - LOGIN_URL=https://login.hotosm.test
      - LOGIN_BACKEND_URL=http://login-backend:8000
      - LOGIN_INTERNAL_API_KEY=${LOGIN_INTERNAL_API_KEY:-hotosm-dev-internal-key}
      - OSM_LOGIN_REDIRECT_URI=https://fair.hotosm.test/authenticate
      - ADMIN_EMAILS=hernangigena@gmail.com,justina@animus.com.ar,andreatchirillano@hotmail.com,emilio.mariscal@hotosm.org
      # fair-py-ops: ZenML (orchestrator) + STAC (catalog) + MinIO (object storage)
      - FAIR_ZENML_STORE_URL=http://fair-zenml:8080
      - ZENML_STORE_URL=http://fair-zenml:8080
      - ZENML_STORE_USERNAME=default
      - ZENML_STORE_PASSWORD=
      - FAIR_STAC_API_URL=http://fair-stac:8080
      - BUCKET_NAME=fair-data
      - PARENT_BUCKET_FOLDER=dev
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=dtm_user
      - AWS_SECRET_ACCESS_KEY=somelongpassword
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fair-backend.rule=Host(`fair.hotosm.test`) && PathPrefix(`/api`)"
      - "traefik.http.routers.fair-backend.entrypoints=websecure"
      - "traefik.http.routers.fair-backend.tls=true"
      - "traefik.http.services.fair-backend.loadbalancer.server.port=8000"
    depends_on:
      fair-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      fair-zenml:
        condition: service_started
      fair-stac:
        condition: service_started

  # fAIr Worker: DISABLED for now.
  #
  # fAIr dropped Celery/Django-Q (develop commit 5caa0f2c, "drops celery, adds
  # zenml integration") and its own docker-compose.yml now runs the worker via
  # `python manage.py db_worker`. That management command does not exist yet
  # in fAIr/backend (no management/commands/ anywhere in the tree as of
  # develop@87bd23d3), so there is nothing for this service to run. Re-add it
  # once db_worker lands upstream, pointed at the same Dockerfile as
  # fair-backend with command: ["python", "manage.py", "db_worker"] and a
  # volume mount of /var/run/docker.sock:/var/run/docker.sock (ZenML's local
  # docker-compose orchestrator needs it to launch pipeline steps).

  # fAIr Database (PostgreSQL + PostGIS) - also backs the zenml/stac databases
  # (see fair-db-init) now that fAIr dropped its separate Celery/Redis broker.
  fair-db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64  # No ARM64 image available
    container_name: hotosm-fair-db
    environment:
      - POSTGRES_USER=fair
      - POSTGRES_PASSWORD=fair
      - POSTGRES_DB=fair
    volumes:
      - fair-db-data:/var/lib/postgresql/data
    networks:
      - hotosm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fair"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the extra databases ZenML/STAC need on fair-db (one Postgres
  # instance, multiple databases - mirrors fAIr's own db-init service).
  fair-db-init:
    image: postgis/postgis:16-3.4
    platform: linux/amd64  # No ARM64 image available
    container_name: hotosm-fair-db-init
    depends_on:
      fair-db:
        condition: service_healthy
    environment:
      - PGHOST=fair-db
      - PGUSER=fair
      - PGPASSWORD=fair
      - PGDATABASE=fair
    command:
      - sh
      - -c
      - |
        set -e
        for db in zenml stac mlflow; do
          psql -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'" | grep -q 1 ||
            psql -c "CREATE DATABASE $$db"
        done
        psql -d stac -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS btree_gist"
    networks:
      - hotosm

  # ZenML server - orchestrates fAIr's detection/training pipelines. Backed by
  # its own database on fair-db. Internal-only (no host port / Traefik route)
  # to avoid clashing with the Traefik dashboard on :8080; reach it from other
  # containers at http://fair-zenml:8080.
  fair-zenml:
    image: ghcr.io/hotosm/fair/zenml-postgres:0.94.2
    platform: linux/amd64  # No ARM64 image available
    container_name: hotosm-fair-zenml
    restart: on-failure
    depends_on:
      fair-db-init:
        condition: service_completed_successfully
    environment:
      - ZENML_STORE_URL=postgresql://fair:fair@fair-db:5432/zenml
      - ZENML_STORE_TYPE=sql
      - ZENML_STORE_BACKUP_STRATEGY=disabled
      - ZENML_SERVER_AUTO_ACTIVATE=1
      - ZENML_ANALYTICS_OPT_IN=false
    networks:
      - hotosm

  # STAC catalog (pgstac) - one-off migration then the API server.
  fair-stac-migrate:
    image: ghcr.io/stac-utils/pgstac-pypgstac:v0.9.9
    container_name: hotosm-fair-stac-migrate
    depends_on:
      fair-db-init:
        condition: service_completed_successfully
    environment:
      - PGHOST=fair-db
      - PGPORT=5432
      - PGUSER=fair
      - PGPASSWORD=fair
      - PGDATABASE=stac
    command: ["pypgstac", "migrate"]
    networks:
      - hotosm

  fair-stac:
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:5.0.2
    platform: linux/amd64  # No ARM64 image available
    container_name: hotosm-fair-stac
    depends_on:
      fair-stac-migrate:
        condition: service_completed_successfully
    environment:
      - POSTGRES_HOST_READER=fair-db
      - POSTGRES_HOST_WRITER=fair-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=fair
      - POSTGRES_PASS=fair
      - POSTGRES_DBNAME=stac
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - ENABLE_TRANSACTIONS_EXTENSIONS=TRUE
    networks:
      - hotosm

  # MLflow - experiment tracking for fAIr's training pipeline. Uses the shared
  # minio for artifact storage; metadata lives in its own DB on fair-db.
  fair-mlflow:
    image: burakince/mlflow:3.7.0
    container_name: hotosm-fair-mlflow
    depends_on:
      fair-db-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=dtm_user
      - AWS_SECRET_ACCESS_KEY=somelongpassword
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://fair:fair@fair-db:5432/mlflow
      - --default-artifact-root=s3://fair-data/mlflow/
      - --serve-artifacts
    networks:
      - hotosm

  # ==========================================
  # uMap - User Map Editor
  # ==========================================

  # uMap Database (PostGIS)
  umap-db:
    platform: linux/amd64  # No ARM64 image available
    image: postgis/postgis:14-3.5-alpine
    container_name: hotosm-umap-db
    environment:
      - POSTGRES_DB=umap
      - POSTGRES_USER=umap
      - POSTGRES_PASSWORD=umap123456
    volumes:
      - umap-db-data:/var/lib/postgresql/data
    networks:
      - hotosm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umap"]
      interval: 10s
      timeout: 5s
      retries: 5

  # uMap Application (Django)
  umap-app:
    platform: linux/amd64
    build:
      context: ../umap/app
      dockerfile: Dockerfile
    container_name: hotosm-umap-app
    volumes:
      - ../umap/app:/app
      - /app/.venv  # Preserve .venv from build
      - ./certs/localhost.crt:/etc/ssl/certs/localhost.crt:ro
    entrypoint: []
    command: >
      bash -c "
        /app/scripts/wait-for-db.sh &&
        uv run python manage.py collectstatic --noinput &&
        uv run python manage.py migrate social_django &&
        uv run python manage.py migrate &&
        uv run python manage.py import_pictograms --attribution 'Maki Icons by Mapbox' /app/custom/icons &&
        uv run python manage.py runserver 0.0.0.0:8000
      "
    environment:
      - UMAP_SITE_URL=https://umap.hotosm.test
      - UMAP_SETTINGS=/app/settings.py
      - UMAP_SECRET_KEY=${UMAP_SECRET_KEY:-change-me-in-production-min-32-chars}
      - UMAP_DB_HOST=umap-db
      - UMAP_DB_NAME=umap
      - UMAP_DB_USER=umap
      - UMAP_DB_PASSWORD=umap123456
      - PGPASSWORD=umap123456
      - DEBUG=${DEBUG:-true}
      - ALLOWED_HOSTS=umap.hotosm.test,localhost,127.0.0.1,umap-app
      - CSRF_TRUSTED_ORIGINS=https://umap.hotosm.test
      - AUTH_PROVIDER=${AUTH_PROVIDER:-hanko}
      # Backend uses internal HTTP URL (no SSL issues)
      - HANKO_API_URL=http://hanko:8000
      # Frontend uses public HTTPS URL (for web component)
      - HANKO_PUBLIC_URL=https://login.hotosm.test
      - JWT_ISSUER=https://login.hotosm.test
      - COOKIE_SECRET=${COOKIE_SECRET:-change-me-in-production-min-32-chars}
      - COOKIE_DOMAIN=.hotosm.test
      - COOKIE_SECURE=false
      - ADMIN_EMAILS=hernangigena@gmail.com,justina@animus.com.ar,andreatchirillano@hotmail.com,emilio.mariscal@hotosm.org
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umap-app.rule=Host(`umap.hotosm.test`)"
      - "traefik.http.routers.umap-app.entrypoints=websecure"
      - "traefik.http.routers.umap-app.tls=true"
      - "traefik.http.services.umap-app.loadbalancer.server.port=8000"
    depends_on:
      umap-db:
        condition: service_healthy

  # ==========================================
  # ChatMap - Chat to Map Converter
  # ==========================================

  # ChatMap Frontend (React + Vite)
  chatmap-frontend:
    build:
      context: ../chatmap/chatmap-ui
      dockerfile: Dockerfile
    container_name: hotosm-chatmap-frontend
    volumes:
      - ../chatmap/chatmap-ui/src:/app/src
      - ../chatmap/chatmap-ui/public:/app/public
      - ./config/chatmap-config.json:/usr/share/nginx/html/config.json:ro
      - ../chatmap/chatmap-ui/index.html:/app/index.html
      - ../chatmap/chatmap-ui/vite.config.js:/app/vite.config.js
      # Note: @hotosm/hanko-auth is now installed from npm
    environment:
      - VITE_HANKO_URL=https://login.hotosm.test
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chatmap-frontend.rule=Host(`chatmap.hotosm.test`)"
      - "traefik.http.routers.chatmap-frontend.entrypoints=websecure"
      - "traefik.http.routers.chatmap-frontend.tls=true"
      - "traefik.http.services.chatmap-frontend.loadbalancer.server.port=80"

  # ChatMap Backend (FastAPI)
  chatmap-backend:
    build:
      context: ../chatmap/chatmap-api
      dockerfile: Dockerfile
      target: development
    container_name: hotosm-chatmap-backend
    volumes:
      - ../chatmap/chatmap-api:/app
    environment:
      - CHATMAP_API_DEBUG=true
      - CHATMAP_API_URL=https://chatmap.hotosm.test/api
      - CHATMAP_DB_HOST=chatmap-db
      - CHATMAP_DB_USER=chatmap
      - CHATMAP_DB_PASSWORD=chatmap
      - CHATMAP_DB=chatmap
      - HANKO_API_URL=http://hanko:8000
      - JWT_ISSUER=https://login.hotosm.test
      - COOKIE_SECRET=${COOKIE_SECRET:-change-me-in-production-min-32-chars}
      - REDIS_HOST=redis
      - SERVER_URL=http://chatmap-go:8001
      - CHATMAP_ENC_KEY=${CHATMAP_ENC_KEY:-0123456789ABCDEF0123456789ABCDEF}
    networks:
      - hotosm
    depends_on:
      chatmap-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chatmap-go:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chatmap-backend.rule=Host(`chatmap.hotosm.test`) && PathPrefix(`/api`)"
      - "traefik.http.routers.chatmap-backend.entrypoints=websecure"
      - "traefik.http.routers.chatmap-backend.tls=true"
      - "traefik.http.middlewares.chatmap-strip-api.stripprefix.prefixes=/api"
      - "traefik.http.routers.chatmap-backend.middlewares=chatmap-strip-api"
      - "traefik.http.services.chatmap-backend.loadbalancer.server.port=8000"

  # ChatMap Database (PostgreSQL + PostGIS)
  chatmap-db:
    image: postgis/postgis:16-3.4-alpine
    platform: linux/amd64  # No ARM64 image available
    container_name: hotosm-chatmap-db
    environment:
      - POSTGRES_USER=chatmap
      - POSTGRES_PASSWORD=chatmap
      - POSTGRES_DB=chatmap
    volumes:
      - chatmap-db-data:/var/lib/postgresql/data
    networks:
      - hotosm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatmap"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChatMap Go Backend (WhatsApp connector)
  chatmap-go:
    image: golang:1.24
    container_name: hotosm-chatmap-go
    working_dir: /app
    command: sh -c "go mod download && go run main.go"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHATMAP_ENC_KEY=${CHATMAP_ENC_KEY:-0123456789ABCDEF0123456789ABCDEF}
    volumes:
      - ../chatmap/chatmap-im-connector:/app
      - chatmap-sessions:/app/sessions
    networks:
      - hotosm
    depends_on:
      redis:
        condition: service_healthy

  # ==========================================
  # OSM Export Tool - OSM Data Export Service
  # ==========================================

  # Export Tool Database (PostgreSQL + PostGIS)
  export-tool-db:
    platform: linux/amd64  # Required for Mac M1/M2/M3 compatibility
    image: postgis/postgis:16-3.4-alpine
    container_name: hotosm-export-tool-db
    environment:
      - POSTGRES_USER=exports
      - POSTGRES_PASSWORD=exports
      - POSTGRES_DB=exports
    volumes:
      - export-tool-db-data:/var/lib/postgresql/data
    networks:
      - hotosm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exports"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Export Tool Redis (for Dramatiq task queue)
  export-tool-redis:
    image: redis:7-alpine
    container_name: hotosm-export-tool-redis
    networks:
      - hotosm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Export Tool Application (Django)
  export-tool-app:
    platform: linux/amd64  # Required for Mac M1/M2/M3 compatibility
    build:
      context: ../osm-export-tool
      dockerfile: docker/Dockerfile.dev
      target: development
    container_name: hotosm-export-tool-app
    volumes:
      - ../osm-export-tool:/app
      - export-tool-downloads:/app/export_downloads
      - ./config/export-tool-settings.py:/app/core/settings/docker.py:ro
      - ../login/auth-libs/web-component/dist/hanko-auth.esm.js:/app/ui/static/ui/js/hanko-auth.esm.js:ro
    environment:
      - DATABASE_URL=postgis://exports:exports@export-tool-db:5432/exports
      - DEBUG=True
      - DJANGO_ENV=development
      - DJANGO_SETTINGS_MODULE=core.settings.docker
      - HOSTNAME=export-tool.hotosm.test
      - ALLOWED_HOSTS=export-tool.hotosm.test,localhost,127.0.0.1,export-tool-app
      - USE_X_FORWARDED_HOST=true
      - SECRET_KEY=dev-secret-key-change-in-production
      # Redis for Dramatiq
      - REDIS_HOST=export-tool-redis
      - REDIS_PORT=6379
      # OSM OAuth (same as other services)
      - OSM_CLIENT_ID=${OSM_CLIENT_ID}
      - OSM_CLIENT_SECRET=${OSM_CLIENT_SECRET}
      # Email (using mailhog)
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=false
      # Overpass API
      - OVERPASS_API_URL=https://overpass-api.de/api/
      # Raw Data API (internal URL for backend/worker processing)
      - RAW_DATA_API_URL=http://raw-data-api:8000/
      # Raw Data API (public URL for browser JS requests via Traefik)
      - RAW_DATA_API_PUBLIC_URL=https://raw-data-api.hotosm.test/
      # HDX (required for settings to load, use dummy key for dev)
      - HDX_API_KEY=dev-hdx-api-key
      - HDX_SITE=demo
      - SYNC_TO_HDX=false
      # Hanko SSO Authentication
      - AUTH_PROVIDER=${AUTH_PROVIDER:-hanko}
      - HANKO_API_URL=http://hanko:8000
      - HANKO_PUBLIC_URL=https://login.hotosm.test
      - JWT_ISSUER=https://login.hotosm.test
      - COOKIE_SECRET=${COOKIE_SECRET:-change-me-in-production-min-32-chars}
      - COOKIE_DOMAIN=.hotosm.test
      - COOKIE_SECURE=false
      - ADMIN_EMAILS=hernangigena@gmail.com,justina@animus.com.ar,andreatchirillano@hotmail.com,emilio.mariscal@hotosm.org
    command: >
      sh -c "
        cd /app/ui && ([ -d node_modules ] || yarn install || true) && ([ -f static/ui/js/bundle.js ] || yarn run dist || true) &&
        yarn run watch &
        cd /app &&
        python3 manage.py migrate --noinput &&
        python3 manage.py collectstatic --noinput || true &&
        python3 manage.py runserver 0.0.0.0:8000
      "
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.export-tool-app.rule=Host(`export-tool.hotosm.test`)"
      - "traefik.http.routers.export-tool-app.entrypoints=websecure"
      - "traefik.http.routers.export-tool-app.tls=true"
      - "traefik.http.services.export-tool-app.loadbalancer.server.port=8000"
    depends_on:
      export-tool-db:
        condition: service_healthy
      export-tool-redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  # Export Tool Worker (Dramatiq for background tasks)
  export-tool-worker:
    platform: linux/amd64  # Required for Mac M1/M2/M3 compatibility
    build:
      context: ../osm-export-tool
      dockerfile: docker/Dockerfile.dev
      target: development
    container_name: hotosm-export-tool-worker
    volumes:
      - ../osm-export-tool:/app
      - export-tool-downloads:/app/export_downloads
      - ./config/export-tool-settings.py:/app/core/settings/docker.py:ro
    environment:
      - DATABASE_URL=postgis://exports:exports@export-tool-db:5432/exports
      - DEBUG=True
      - DJANGO_ENV=development
      - DJANGO_SETTINGS_MODULE=core.settings.docker
      - HOSTNAME=export-tool.hotosm.test
      - SECRET_KEY=dev-secret-key-change-in-production
      # Redis for Dramatiq
      - REDIS_HOST=export-tool-redis
      - REDIS_PORT=6379
      # OSM OAuth
      - OSM_CLIENT_ID=${OSM_CLIENT_ID}
      - OSM_CLIENT_SECRET=${OSM_CLIENT_SECRET}
      # Email
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=false
      # Overpass API
      - OVERPASS_API_URL=https://overpass-api.de/api/
      # Raw Data API
      - RAW_DATA_API_URL=http://raw-data-api:8000/
      # HDX (required for settings to load, use dummy key for dev)
      - HDX_API_KEY=dev-hdx-api-key
      - HDX_SITE=demo
      - SYNC_TO_HDX=false
      # Hanko SSO Authentication
      - AUTH_PROVIDER=${AUTH_PROVIDER:-hanko}
      - HANKO_API_URL=http://hanko:8000
      - HANKO_PUBLIC_URL=https://login.hotosm.test
      - JWT_ISSUER=https://login.hotosm.test
      - COOKIE_SECRET=${COOKIE_SECRET:-change-me-in-production-min-32-chars}
      - COOKIE_DOMAIN=.hotosm.test
      - COOKIE_SECURE=false
      - ADMIN_EMAILS=hernangigena@gmail.com,justina@animus.com.ar,andreatchirillano@hotmail.com,emilio.mariscal@hotosm.org
    command: python3 -m dramatiq tasks.task_runners -p 1
    networks:
      - hotosm
    depends_on:
      export-tool-db:
        condition: service_healthy
      export-tool-redis:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # Raw Data API - OSM data extraction backend
  # ==========================================

  raw-data-api-db:
    image: postgis/postgis:16-3.4-alpine
    platform: linux/amd64  # No ARM64 image available
    container_name: hotosm-raw-data-api-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=raw
    volumes:
      - raw-data-api-db-data:/var/lib/postgresql/data
      - ../raw-data-api/tests/fixtures/pokhara.sql:/docker-entrypoint-initdb.d/pokhara.sql
    networks:
      - hotosm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raw"]
      interval: 10s
      timeout: 5s
      retries: 5

  raw-data-api:
    build:
      context: ../raw-data-api
    container_name: hotosm-raw-data-api
    volumes:
      - ../raw-data-api/API:/home/appuser/API
      - ../raw-data-api/src:/home/appuser/src
    environment:
      - PGHOST=raw-data-api-db
      - PGUSER=postgres
      - PGPASSWORD=admin
      - PGDATABASE=raw
      - PGPORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - RATE_LIMITER_STORAGE_URI=redis://redis:6379/1
      - LOG_LEVEL=info
      - EXPORT_PATH=/tmp/exports
      - ENABLE_POLYGON_STATISTICS_ENDPOINTS=true
      - ENABLE_CUSTOM_EXPORTS=true
      - DEFAULT_QUEUE_NAME=raw_ondemand
      - OSM_URL=https://www.openstreetmap.org
      - OSM_CLIENT_ID=dummy
      - OSM_CLIENT_SECRET=dummy
      - APP_SECRET_KEY=dev-secret-key-raw-data-api
      - LOGIN_REDIRECT_URI=https://raw-data-api.hotosm.test/v1/auth/callback
      - OSM_PERMISSION_SCOPE=read_prefs
    command: uvicorn API.main:app --reload --host 0.0.0.0 --port 8000 --no-use-colors --proxy-headers
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.raw-data-api.rule=Host(`raw-data-api.hotosm.test`)"
      - "traefik.http.routers.raw-data-api.entrypoints=websecure"
      - "traefik.http.routers.raw-data-api.tls=true"
      - "traefik.http.services.raw-data-api.loadbalancer.server.port=8000"
    depends_on:
      raw-data-api-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  raw-data-api-worker:
    build:
      context: ../raw-data-api
    container_name: hotosm-raw-data-api-worker
    volumes:
      - ../raw-data-api/API:/home/appuser/API
      - ../raw-data-api/src:/home/appuser/src
    environment:
      - PGHOST=raw-data-api-db
      - PGUSER=postgres
      - PGPASSWORD=admin
      - PGDATABASE=raw
      - PGPORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - LOG_LEVEL=info
      - EXPORT_PATH=/tmp/exports
      - ENABLE_CUSTOM_EXPORTS=true
      - DEFAULT_QUEUE_NAME=raw_ondemand
      - OSM_URL=https://www.openstreetmap.org
      - OSM_CLIENT_ID=dummy
      - OSM_CLIENT_SECRET=dummy
      - APP_SECRET_KEY=dev-secret-key-raw-data-api
      - LOGIN_REDIRECT_URI=https://raw-data-api.hotosm.test/v1/auth/callback
      - OSM_PERMISSION_SCOPE=read_prefs
    command: celery --app API.api_worker worker --loglevel=INFO --queues="raw_ondemand" -n "default_worker"
    networks:
      - hotosm
    depends_on:
      raw-data-api-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # Tasking Manager
  # ==========================================

  # TM Database (PostGIS)
  tm-db:
    image: postgis/postgis:14-3.4
    platform: linux/amd64  # No ARM64 image available
    container_name: hotosm-tm-db
    environment:
      - POSTGRES_USER=tm
      - POSTGRES_PASSWORD=tm
      - POSTGRES_DB=tasking-manager
    volumes:
      - tm-db-data:/var/lib/postgresql/data
    networks:
      - hotosm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tm -d tasking-manager"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TM Database Migrations (one-shot, runs before backend)
  tm-migration:
    build:
      context: ../tasking-manager
      dockerfile: scripts/docker/Dockerfile
      target: debug
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: hotosm-tm-migration
    entrypoint: ["alembic", "-c", "migrations/alembic.ini", "upgrade", "head"]
    env_file:
      - ./config/tasking-manager.env
    volumes:
      - ../tasking-manager/backend:/usr/src/app/backend
      - ../tasking-manager/migrations:/usr/src/app/migrations
    depends_on:
      tm-db:
        condition: service_healthy
    networks:
      - hotosm
    restart: "no"

  # TM Backend (FastAPI + uvicorn --reload for live editing)
  tm-backend:
    build:
      context: ../tasking-manager
      dockerfile: scripts/docker/Dockerfile
      target: debug
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: hotosm-tm-backend
    volumes:
      - ../tasking-manager/backend:/usr/src/app/backend
      - ../tasking-manager/migrations:/usr/src/app/migrations
      - ../tasking-manager/pyproject.toml:/usr/src/app/pyproject.toml
      - ../tasking-manager/uv.lock:/usr/src/app/uv.lock
    env_file:
      - ./config/tasking-manager.env
    environment:
      - OAUTHLIB_INSECURE_TRANSPORT=1
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tm-backend.rule=Host(`tm.hotosm.test`) && PathPrefix(`/api`)"
      - "traefik.http.routers.tm-backend.entrypoints=websecure"
      - "traefik.http.routers.tm-backend.tls=true"
      - "traefik.http.services.tm-backend.loadbalancer.server.port=5000"
    depends_on:
      tm-db:
        condition: service_healthy
      tm-migration:
        condition: service_completed_successfully

  # TM Frontend (React + Craco dev server with HMR for live editing)
  tm-frontend:
    build:
      context: ../tasking-manager
      dockerfile: scripts/docker/Dockerfile.frontend
      target: debug
    container_name: hotosm-tm-frontend
    volumes:
      - ../tasking-manager/frontend:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./config/tasking-manager.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - hotosm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tm-frontend.rule=Host(`tm.hotosm.test`)"
      - "traefik.http.routers.tm-frontend.entrypoints=websecure"
      - "traefik.http.routers.tm-frontend.tls=true"
      - "traefik.http.services.tm-frontend.loadbalancer.server.port=3000"
    depends_on:
      - tm-backend

  # TM Cron Jobs (background task scheduler)
  tm-cron-jobs:
    build:
      context: ../tasking-manager
      dockerfile: scripts/docker/Dockerfile
      target: debug
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: hotosm-tm-cron-jobs
    command: ["python", "backend/cron_jobs.py"]
    env_file:
      - ./config/tasking-manager.env
    environment:
      - PYTHONPATH=/usr/src/app
    depends_on:
      tm-db:
        condition: service_healthy
    networks:
      - hotosm
    restart: unless-stopped

  # Auth Libs Web Component Watcher (auto-rebuilds on source changes)
  auth-libs-watch:
    image: node:20-alpine
    container_name: hotosm-auth-libs-watch
    working_dir: /src
    volumes:
      - ../login/auth-libs/web-component:/src
    command: sh -c "npm install --prefer-offline && npm run watch"
    networks:
      - hotosm
    restart: unless-stopped
